name: user_screen
description: "Pour Ledger - Time each vessel in a wax sitting, log pour jobs and wax lots, and estimate how many pieces fit the day. Offline studio journal with no account and no data collection."
version: 1.0.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3

  # State Management
  flutter_riverpod: ^2.6.1

  # Date formatting
  intl: ^0.19.0

  # UUID generation
  uuid: ^4.5.1

  # Charts
  fl_chart: ^0.69.2

  # PDF & Export
  pdf: ^3.11.1
  printing: ^5.13.4
  csv: ^6.0.0

  # Share functionality
  share_plus: ^10.1.2

  # Photo capture
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
